<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Dashboard – ROR PARTNERSHIP DATAHUB</title>
  <link rel="stylesheet" href="/public/css_file/styles.css" />
  <style>
    body {
      background: linear-gradient(135deg, #003366, #0066cc);
      color: white;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1100px;
      width: 90%;
      margin: 60px auto;
      text-align: center;
    }
    h1 {
      margin-bottom: 50px;
      font-size: 2.8rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }
    .card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      transition: transform 0.3s, box-shadow 0.3s;
      color: #003366;
      text-decoration: none;
    }
    .card:hover {
      transform: translateY(-12px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    }
    .card i {
      font-size: 3.5rem;
      margin-bottom: 20px;
      color: #0066cc;
    }
    .card h2 {
      margin: 15px 0;
      font-size: 1.8rem;
    }
    .card p {
      color: #555;
      font-size: 1.1rem;
    }
    .logout {
      margin-top: 60px;
      color: white;
      font-size: 1.2rem;
      text-decoration: none;
      padding: 12px 30px;
      border: 2px solid white;
      border-radius: 30px;
      transition: all 0.3s;
    }
    .logout:hover {
      background: white;
      color: #003366;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Welcome to Your Dashboard</h1>

  <div class="cards">
    <a href="/upload-dataset.html" class="card">
      <i class="fas fa-file-upload"></i>
      <h2>Upload Dataset</h2>
      <p>Bulk upload records from Excel files</p>
    </a>

    <a href="/add-record.html" class="card">
      <i class="fas fa-user-plus"></i>
      <h2>Add Individual Record</h2>
      <p>Manually add a single record</p>
    </a>

    <a href="/upload-image.html" class="card">
      <i class="fas fa-images"></i>
      <h2>Upload Photos</h2>
      <p>Add photos to existing records</p>
    </a>
  </div>

  <a href="/logout" class="logout">Logout</a>
</div>

</body>
</html>
