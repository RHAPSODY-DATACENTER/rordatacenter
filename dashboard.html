<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROR PARTNERSHIP DATAHUB Admin</title>
  <link rel="stylesheet" href="/public/css_file/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: linear-gradient(135deg, #003366, #0066cc); min-height: 100vh; font-family: 'Poppins', sans-serif; }
    .dashboard-container { max-width: 1300px; margin: 40px auto; padding: 20px; }
    .back { display: inline-block; margin-bottom: 20px; color: white; text-decoration: none; font-weight: bold; }
    h1 { text-align: center; color: white; margin-bottom: 40px; font-size: 2.5rem; }
    .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
    .tab-btn { padding: 12px 30px; border-radius: 30px; background: transparent; color: white; font-weight: 600; cursor: pointer; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.3); }
    .tab-btn:hover { background: rgba(255,255,255,0.2); }
    .tab-btn.active { background: white; color: #003366; border-color: white; }
    .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); margin-bottom: 40px; }
    .card h2 { color: #003366; margin-bottom: 20px; font-size: 1.8rem; text-align: center; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .stat-box { background: linear-gradient(135deg, #0066cc, #3399ff); color: white; border-radius: 15px; padding: 20px; text-align: center; }
    .stat-number { font-size: 2.5rem; font-weight: 700; }
    .stat-label { font-size: 1.1rem; opacity: 0.8; }
    .chart-container { position: relative; height: 400px; margin-bottom: 40px; }

    /* Settings Dropdown */
    .settings-dropdown { position: relative; display: inline-block; margin-left: auto; }
    .settings-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
    .settings-menu { 
      position: absolute; 
      right: 0; 
      top: 100%; 
      background: white; 
      border-radius: 10px; 
      box-shadow: 0 8px 16px rgba(0,0,0,0.2); 
      display: none; 
      min-width: 180px; 
      z-index: 1;
    }
    .settings-menu a { 
      display: block; 
      padding: 12px 20px; 
      color: #003366; 
      text-decoration: none; 
      border-bottom: 1px solid rgba(0,0,0,0.1); 
    }
    .settings-menu a:last-child { border-bottom: none; }
    .settings-menu a:hover { background: rgba(0,51,102,0.1); }
    .settings-dropdown.open .settings-menu { display: block; }
  </style>
</head>
<body>

<div class="dashboard-container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <a href="/logout" class="back">← Logout</a>
    
    <!-- Settings Dropdown -->
    <div class="settings-dropdown">
      <button class="settings-btn" onclick="toggleSettings()">
        <i class="fas fa-cog"></i> Settings
      </button>
      <div class="settings-menu">
        <a href="/assign_user.html">Create User</a>
        <a href="/users.html">View Users</a>
      </div>
    </div>
  </div>

  <h1>ROR PARTNERSHIP DATAHUB Admin Dashboard</h1>

  <div class="tabs">
    <button onclick="setMinistry('campus')" class="tab-btn active">BLW Campus Ministry</button>
    <button onclick="setMinistry('church')" class="tab-btn">Christ Embassy Church Ministry</button>
  </div>

  <div class="card">
    <h2 id="ministry-title">BLW Campus Ministry Overview</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-number" id="campus-total">0</div>
        <p class="stat-label">Total Records</p>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="campus-regions">0</div>
        <p class="stat-label">Unique Regions</p>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="campus-zones">0</div>
        <p class="stat-label">Unique Zones</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Records by Region</h2>
    <div class="chart-container">
      <canvas id="campusRegionChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Records by Zone</h2>
    <div class="chart-container">
      <canvas id="campusZoneChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Records by Designation</h2>
    <div class="chart-container">
      <canvas id="campusDesignationChart"></canvas>
    </div>
  </div>
</div>

<script>
  let currentMinistry = 'campus';
  let currentData = { campus: {}, church: {} };

  function toggleSettings() {
    document.querySelector('.settings-dropdown').classList.toggle('open');
  }

  function setMinistry(ministry) {
    currentMinistry = ministry;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[onclick="setMinistry('${ministry}')"]`).classList.add('active');
    updateDashboard();
  }

  function loadDashboard() {
    fetch('/api/dashboard-data')
      .then(res => res.json())
      .then(data => {
        currentData = data;
        updateDashboard();
      })
      .catch(err => console.error(err));
  }

  function updateDashboard() {
    const prefix = currentMinistry;
    const data = currentData[prefix];
    if (!data) return;

    document.getElementById('ministry-title').textContent = `${prefix.toUpperCase() === 'CAMPUS' ? 'BLW Campus Ministry' : 'Christ Embassy Church Ministry'} Overview`;

    document.getElementById(`${prefix}-total`).textContent = data.total_records;
    document.getElementById(`${prefix}-regions`).textContent = data.unique_regions;
    document.getElementById(`${prefix}-zones`).textContent = data.unique_zones;

    // Region Chart
    new Chart(document.getElementById(prefix + 'RegionChart'), {
      type: 'doughnut',
      data: {
        labels: data.regions.map(item => item.region || 'Unknown'),
        datasets: [{
          label: 'Regions',
          data: data.regions.map(item => item.count),
          backgroundColor: ['#003366', '#0066cc', '#3399ff', '#66ccff', '#99ddff', '#ccffff']
        }]
      },
      options: { responsive: true }
    });

    // Zone Chart
    new Chart(document.getElementById(prefix + 'ZoneChart'), {
      type: 'doughnut',
      data: {
        labels: data.zones.map(item => item.zone || 'Unknown'),
        datasets: [{
          label: 'Zones',
          data: data.zones.map(item => item.count),
          backgroundColor: ['#003366', '#0066cc', '#3399ff', '#66ccff', '#99ddff', '#ccffff']
        }]
      },
      options: { responsive: true }
    });

    // Designation Chart
    new Chart(document.getElementById(prefix + 'DesignationChart'), {
      type: 'bar',
      data: {
        labels: data.designations.map(item => item.designation || 'Unknown'),
        datasets: [{
          label: 'Count',
          data: data.designations.map(item => item.count),
          backgroundColor: '#0066cc'
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true } }
      }
    });
  }

  window.onload = loadDashboard;
</script>
</body>
</html>
