<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROR PARTNERSHIP DATAHUB Admin</title>
  <link rel="stylesheet" href="/public/css_file/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { 
      background: linear-gradient(135deg, #003366, #0066cc); 
      min-height: 100vh; 
      font-family: 'Poppins', sans-serif; 
      margin: 0; 
      color: #333; 
    }
    .dashboard-container { 
      max-width: 1400px; 
      margin: 40px auto; 
      padding: 0 20px; 
    }
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 40px; 
    }
    .back { 
      color: white; 
      text-decoration: none; 
      font-weight: bold; 
      font-size: 1.1rem; 
    }
    .back:hover { text-decoration: underline; }
    h1 { 
      text-align: center; 
      color: white; 
      margin: 0; 
      font-size: 2.8rem; 
      text-shadow: 0 2px 8px rgba(0,0,0,0.4); 
    }
    .settings-dropdown { 
      position: relative; 
      display: inline-block; 
    }
    .settings-btn { 
      background: rgba(255,255,255,0.15); 
      border: none; 
      color: white; 
      padding: 10px 20px; 
      border-radius: 30px; 
      font-size: 1.1rem; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.3s; 
    }
    .settings-btn:hover { background: rgba(255,255,255,0.3); }
    .settings-menu { 
      position: absolute; 
      right: 0; 
      top: 100%; 
      background: white; 
      border-radius: 10px; 
      box-shadow: 0 8px 16px rgba(0,0,0,0.2); 
      display: none; 
      min-width: 180px; 
      z-index: 10; 
    }
    .settings-menu a { 
      display: block; 
      padding: 12px 20px; 
      color: #003366; 
      text-decoration: none; 
      border-bottom: 1px solid rgba(0,0,0,0.1); 
    }
    .settings-menu a:last-child { border-bottom: none; }
    .settings-menu a:hover { background: rgba(0,51,102,0.1); }
    .settings-dropdown.open .settings-menu { display: block; }

    .nav-tabs { 
      display: flex; 
      justify-content: center; 
      gap: 15px; 
      margin-bottom: 40px; 
      background: rgba(255,255,255,0.15); 
      padding: 12px; 
      border-radius: 50px; 
      backdrop-filter: blur(10px); 
      box-shadow: 0 8px 32px rgba(0,0,0,0.2); 
      border: 1px solid rgba(255,255,255,0.2); 
    }
    .tab-btn { 
      padding: 12px 40px; 
      font-size: 1.1rem; 
      font-weight: 600; 
      color: white; 
      background: transparent; 
      border: 2px solid rgba(255,255,255,0.4); 
      border-radius: 30px; 
      cursor: pointer; 
      transition: all 0.3s ease; 
    }
    .tab-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
    .tab-btn.active { background: white; color: #003366; border-color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

    .card { 
      background: rgba(255,255,255,0.95); 
      border-radius: 20px; 
      padding: 30px; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.25); 
      margin-bottom: 40px; 
      border: none; 
    }
    .card h2 { 
      color: #003366; 
      margin-bottom: 25px; 
      font-size: 2rem; 
      text-align: center; 
      position: relative; 
    }
    .card h2::after { 
      content: ''; 
      width: 80px; 
      height: 4px; 
      background: #ff6200; 
      position: absolute; 
      bottom: -10px; 
      left: 50%; 
      transform: translateX(-50%); 
      border-radius: 2px; 
    }

    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
      gap: 25px; 
      margin-bottom: 40px; 
    }
    .stat-box { 
      background: linear-gradient(135deg, #0066cc, #3399ff); 
      color: white; 
      border-radius: 15px; 
      padding: 30px; 
      text-align: center; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
      transition: transform 0.3s; 
    }
    .stat-box:hover { transform: translateY(-10px); }
    .stat-number { font-size: 3rem; font-weight: 700; margin-bottom: 10px; }
    .stat-label { font-size: 1.2rem; opacity: 0.9; }

    .chart-container { 
      position: relative; 
      height: 500px; 
      margin-bottom: 20px; 
      background: white; 
      border-radius: 15px; 
      padding: 20px; 
    }
    
    /* Make canvas responsive within container */
    canvas {
        max-width: 100%;
        max-height: 100%;
    }

    .admin-tools { 
      text-align: center; 
      margin: 60px 0; 
    }
    .admin-tools h2 { 
      color: white; 
      margin-bottom: 30px; 
      font-size: 2rem; 
    }
    .upload-btns { 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: center; 
      gap: 30px; 
    }
    .upload-btn { 
      padding: 18px 50px; 
      font-size: 1.2rem; 
      font-weight: bold; 
      border-radius: 50px; 
      text-decoration: none; 
      color: white; 
      transition: all 0.3s; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
    }
    .upload-btn:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 15px 30px rgba(0,0,0,0.4); 
    }
    .btn-dataset { background: #0066cc; }
    .btn-individual { background: #ff6200; }
    .btn-photos { background: #28a745; }
  </style>
</head>
<body>

<div class="dashboard-container">
  <div class="header">
    <a href="/logout" class="back">← Logout</a>
    
    <div class="settings-dropdown">
      <button class="settings-btn" onclick="document.querySelector('.settings-dropdown').classList.toggle('open')">
        <i class="fas fa-cog"></i> Settings
      </button>
      <div class="settings-menu">
        <a href="/assign_user.html">Create User</a>
        <a href="/users.html">View Users</a>
      </div>
    </div>
  </div>

  <h1>ROR PARTNERSHIP DATAHUB Admin Dashboard</h1>

  <div class="nav-tabs">
    <button onclick="setMinistry('campus')" class="tab-btn active">BLW Campus Ministry</button>
    <button onclick="setMinistry('church')" class="tab-btn">Christ Embassy Church Ministry</button>
  </div>

  <div class="card">
    <h2 id="ministry-title">BLW Campus Ministry Overview</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-number" id="total">0</div>
        <p class="stat-label">Total Records</p>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="regions">0</div>
        <p class="stat-label">Unique Regions</p>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="zones">0</div>
        <p class="stat-label">Unique Zones</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Records by Region</h2>
    <div class="chart-container">
      <canvas id="regionChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Records by Zone</h2>
    <div class="chart-container">
      <canvas id="zoneChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Records by Designation</h2>
    <div class="chart-container">
      <canvas id="designationChart"></canvas>
    </div>
  </div>

  <div class="admin-tools">
    <h2>Quick Admin Actions</h2>
    <div class="upload-btns">
      <a href="/upload_dataset.html" class="upload-btn btn-dataset">Upload Dataset (Bulk)</a>
      <a href="/upload_individual.html" class="upload-btn btn-individual">Add Individual Record</a>
      <a href="/upload_image.html" class="upload-btn btn-photos">Upload Photos</a>
    </div>
  </div>
</div>

<script>
  let currentMinistry = 'campus';
  let currentData = { campus: {}, church: {} };
  let charts = { region: null, zone: null, designation: null };

  // Common colors for charts
  const chartColors = [
    '#003366', '#ff6200', '#0066cc', '#33cc33', '#cc0000', 
    '#9933cc', '#ffcc00', '#00cccc', '#ff6699', '#666666'
  ];

  function setMinistry(ministry) {
    currentMinistry = ministry;
    // Update buttons
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[onclick="setMinistry('${ministry}')"]`).classList.add('active');
    updateDashboard();
  }

  function loadDashboard() {
    fetch('/api/dashboard-data')
      .then(res => res.json())
      .then(data => {
        currentData = data;
        updateDashboard();
      })
      .catch(err => console.error('Dashboard load error:', err));
  }

  function updateDashboard() {
    const data = currentData[currentMinistry];
    if (!data) return;

    // 1. Text Stats
    document.getElementById('ministry-title').textContent = 
      `${currentMinistry === 'campus' ? 'BLW Campus Ministry' : 'Christ Embassy Church Ministry'} Overview`;
    document.getElementById('total').textContent = data.total_records || 0;
    document.getElementById('regions').textContent = data.unique_regions || 0;
    document.getElementById('zones').textContent = data.unique_zones || 0;

    // 2. Destroy old charts
    if (charts.region) charts.region.destroy();
    if (charts.zone) charts.zone.destroy();
    if (charts.designation) charts.designation.destroy();

    // 3. Helper to create chart configs safely
    const createChart = (canvasId, type, labels, counts, labelName) => {
        const ctx = document.getElementById(canvasId).getContext('2d');
        return new Chart(ctx, {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: labelName,
                    data: counts,
                    backgroundColor: chartColors,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', display: type === 'doughnut' } // Hide legend for bar charts
                }
            }
        });
    };

    // 4. Render Charts (Data Safe Check)
    const regions = data.regions || [];
    charts.region = createChart(
        'regionChart', 
        'doughnut', 
        regions.map(r => r.region), 
        regions.map(r => r.count), 
        'Regions'
    );

    const zones = data.zones || [];
    charts.zone = createChart(
        'zoneChart', 
        'doughnut', 
        zones.map(z => z.zone), 
        zones.map(z => z.count), 
        'Zones'
    );

    const designations = data.designations || [];
    charts.designation = createChart(
        'designationChart', 
        'bar', 
        designations.map(d => d.designation), 
        designations.map(d => d.count), 
        'Designations'
    );
  }

  window.onload = loadDashboard;
</script>
</body>
</html>
