<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ROR PARTNERSHIP DATAHUB - Search Data</title>

  <!-- Font Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Your Public CSS -->
  <link rel="stylesheet" href="/public/css_file/styles.css">
</head>

<body>
  <header class="nav">
    <!-- Your original header content here -->
  </header>

  <main>
    <section class="search-section">
      <h1>Search Records</h1>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by name or KC ID..." autocomplete="off">
        <select id="ministrySelect">
          <option value="campus">BLW Campus Ministry</option>
          <option value="church">Christ Embassy Church Ministry</option>
        </select>
        <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
      </div>

      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <!-- Gallery Modal -->
  <div id="galleryModal">
    <div class="gallery-content">
      <button id="prevBtn" class="gallery-nav"><i class="fas fa-chevron-left"></i></button>
      <img id="galleryImg" class="gallery-img" src="" alt="Gallery">
      <button id="nextBtn" class="gallery-nav"><i class="fas fa-chevron-right"></i></button>
      <p id="galleryCaption"></p>
    </div>
  </div>

  <footer>
    <!-- Your original footer content here -->
  </footer>

  <!-- External JavaScript file -->
  <script src="/public/js/search.js"></script>
</body>
</html>
