<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ROR Partnership DataHub – Search</title>

  <!-- Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    /* ===== SEARCH SECTION ===== */
    .search-section {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .search-section h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #002b5c;
      margin-bottom: 20px;
    }

    .search-container {
      display: flex;
      gap: 12px;
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      flex-wrap: wrap;
    }

    .search-container input,
    .search-container select {
      flex: 1;
      min-width: 220px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 0.95rem;
    }

    .search-container input:focus,
    .search-container select:focus {
      outline: none;
      border-color: #0056b3;
    }

    #searchBtn {
      background: #0056b3;
      color: #fff;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    #searchBtn:hover {
      background: #003f8a;
      transform: translateY(-1px);
    }

    /* ===== RESULTS ===== */
    .results-grid {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    .person-card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .person-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.12);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .person-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #003366;
      margin: 0;
    }

    .profile-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: #f1f4f8;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: #e0e7ef;
    }

    .person-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 16px;
      font-size: 0.9rem;
    }

    .person-info p {
      margin: 0;
      color: #444;
    }

    .person-info strong {
      color: #111;
    }

    /* ===== PHOTOS ===== */
    .person-photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }

    .photo-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #f0f0f0;
    }

    .photo-container img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      cursor: pointer;
    }

    .download-btn {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 13px;
    }

    .download-btn:hover {
      background: rgba(0,0,0,0.9);
    }

    .loading,
    .no-results,
    .error {
      text-align: center;
      font-size: 1rem;
      padding: 40px 20px;
      color: #666;
    }

    /* ===== GALLERY MODAL ===== */
    #galleryModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .gallery-content {
      position: relative;
      max-width: 90%;
      max-height: 90vh;
    }

    .gallery-img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      padding: 15px;
      cursor: pointer;
      font-size: 1.8rem;
    }

    #prevBtn { left: 20px; }
    #nextBtn { right: 20px; }

    #galleryCaption {
      color: #fff;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<main>
  <section class="search-section">
    <h1>Search Records</h1>

    <div class="search-container">
      <input
        type="search"
        id="searchInput"
        placeholder="Search by name or KC ID"
        autocomplete="off"
      >

      <select id="ministrySelect">
        <option value="campus">BLW Campus Ministry</option>
        <option value="church">Christ Embassy Church Ministry</option>
      </select>

      <button id="searchBtn">
        <i class="fas fa-search"></i> Search
      </button>
    </div>

    <div id="results" class="results-grid"></div>
  </section>
</main>

<!-- GALLERY -->
<div id="galleryModal">
  <div class="gallery-content">
    <button id="prevBtn" class="gallery-nav">
      <i class="fas fa-chevron-left"></i>
    </button>
    <img id="galleryImg" class="gallery-img">
    <button id="nextBtn" class="gallery-nav">
      <i class="fas fa-chevron-right"></i>
    </button>
    <p id="galleryCaption"></p>
  </div>
</div>

<script>
  const searchInput = document.getElementById('searchInput');
  const ministrySelect = document.getElementById('ministrySelect');
  const searchBtn = document.getElementById('searchBtn');
  const resultsDiv = document.getElementById('results');

  // Autofocus
  window.addEventListener('load', () => searchInput.focus());

  searchBtn.addEventListener('click', performSearch);

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      performSearch();
    }
  });

  async function performSearch() {
    const q = searchInput.value.trim();
    if (!q) {
      resultsDiv.innerHTML = '<p class="no-results">Please enter a name or KC ID</p>';
      return;
    }

    resultsDiv.innerHTML = '<p class="loading">Searching…</p>';

    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&ministry=${ministrySelect.value}`);
      const data = await res.json();
      data.length ? displayResults(data) : resultsDiv.innerHTML = '<p class="no-results">No records found</p>';
    } catch (e) {
      resultsDiv.innerHTML = '<p class="error">Search failed</p>';
    }
  }

  function displayResults(people) {
    resultsDiv.innerHTML = '';

    people.forEach(p => {
      const card = document.createElement('div');
      card.className = 'person-card';

      card.innerHTML = `
        <div class="card-header">
          <h2 class="person-name">${p.name}</h2>
          <div class="profile-actions">
            <button class="action-btn" onclick="shareProfile('${p.name}','${p.kc_id || ''}')">
              <i class="fab fa-whatsapp"></i>
            </button>
            <button class="action-btn" onclick="copyProfile('${p.name}','${p.kc_id || ''}')">
              <i class="fas fa-copy"></i>
            </button>
          </div>
        </div>

        <div class="person-info">
          <p><strong>KC ID:</strong> ${p.kc_id || '—'}</p>
          <p><strong>Designation:</strong> ${p.designation || '—'}</p>
          <p><strong>Region:</strong> ${p.region || '—'}</p>
          <p><strong>Group:</strong> ${p.group || '—'}</p>
        </div>
      `;

      const photos = document.createElement('div');
      photos.className = 'person-photos';

      (p.all_photos || []).forEach((url, i) => {
        photos.innerHTML += `
          <div class="photo-container">
            <img src="${url}" onclick="openGallery(${JSON.stringify(p.all_photos)},${i},'${p.name}')">
            <a href="${url}" download class="download-btn">
              <i class="fas fa-download"></i>
            </a>
          </div>
        `;
      });

      card.appendChild(photos);
      resultsDiv.appendChild(card);
    });
  }

  function shareProfile(name, kc) {
    const text = `ROR Partnership Record\nName: ${name}\nKC ID: ${kc}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
  }

  function copyProfile(name, kc) {
    navigator.clipboard.writeText(`Name: ${name}\nKC ID: ${kc}`);
    alert('Profile copied');
  }

  let currentPhotos = [], currentIndex = 0, currentName = '';

  function openGallery(photos, index, name) {
    currentPhotos = photos;
    currentIndex = index;
    currentName = name;
    document.getElementById('galleryImg').src = photos[index];
    document.getElementById('galleryCaption').textContent =
      `${name} (${index + 1}/${photos.length})`;
    document.getElementById('galleryModal').style.display = 'flex';
  }

  document.getElementById('galleryModal').addEventListener('click', e => {
    if (e.target.id === 'galleryModal') {
      e.currentTarget.style.display = 'none';
    }
  });
</script>

</body>
</html>
