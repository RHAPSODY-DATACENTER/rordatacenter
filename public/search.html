<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ROR PARTNERSHIP DATAHUB - Search Data</title>

  <!-- Font Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Your Public CSS -->
  <link rel="stylesheet" href="/public/css_file/styles.css">

  <style>
    /* Minimal additions for multi-photo display + download */
    .photos-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
    }
    .photo-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .photo-wrapper:hover {
      transform: scale(1.05);
    }
    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }
    .download-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.65);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
      transition: all 0.2s;
    }
    .download-btn:hover {
      opacity: 1;
      background: rgba(0,0,0,0.9);
    }
    .no-photos {
      color: #777;
      font-style: italic;
    }
  </style>
</head>

<body>
  <!-- Your original header content -->

  <main>
    <section class="search-section">
      <h1>Search Records</h1>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by name or KC ID..." autocomplete="off">
        <select id="ministrySelect">
          <option value="campus">BLW Campus Ministry</option>
          <option value="church">Christ Embassy Church Ministry</option>
        </select>
        <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
      </div>

      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <!-- Gallery Modal (original) -->
  <div id="galleryModal">
    <div class="gallery-content">
      <button id="prevBtn" class="gallery-nav"><i class="fas fa-chevron-left"></i></button>
      <img id="galleryImg" style="max-width:90%; max-height:85vh; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.8);" src="" alt="Photo">
      <button id="nextBtn" class="gallery-nav" style="position:absolute; top:50%; right:30px; transform:translateY(-50%); color:white; font-size:60px; cursor:pointer; opacity:0.7;" onclick="nextImage()">&#10095;</button>
      <div id="galleryCaption" style="color:white; font-size:1.3rem; margin-top:20px;"></div>
    </div>
  </div>

  <!-- Your original footer -->

  <script src="/public/js/search.js" defer></script>
</body>
</html>
