<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Photos - ROR PARTNERSHIP DATAHUB</title>
  <link rel="stylesheet" href="/public/css_file/styles.css" />
  <style>
    body {
      background: linear-gradient(135deg, #003366, #0066cc);
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 60px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #003366;
      margin-bottom: 30px;
    }
    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
    }
    .back:hover { text-decoration: underline; }
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    label {
      font-weight: 600;
      color: #003366;
    }
    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    #suggestions {
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
      background: white;
      border-radius: 8px;
      margin-top: 5px;
      display: none;
    }
    .suggestion-item {
      padding: 10px;
      cursor: pointer;
    }
    .suggestion-item:hover {
      background: #f0f0f0;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #0055aa; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .preview-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #ddd;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div class="container">
  <a href="/admin" class="back">← Back to Dashboard</a>
  <h1>Upload Photos to Record</h1>

  <form id="uploadImageForm" enctype="multipart/form-data">
    <label for="ministry">Ministry</label>
    <select id="ministry" name="ministry" required>
      <option value="">-- Select --</option>
      <option value="campus">BLW Campus Ministry</option>
      <option value="church">Christ Embassy Church Ministry</option>
    </select>

    <label for="name">Search Record Name</label>
    <input type="text" id="name" name="name" placeholder="Type name to search..." required autocomplete="off">
    <div id="suggestions"></div>

    <label for="images">Select Photos (max 4)</label>
    <input type="file" id="images" name="images" accept="image/*" multiple required />
    <div id="preview"></div>

    <button type="submit" id="submitBtn">Upload Photos</button>
  </form>

  <div id="result"></div>
</div>

<script>
  const form = document.getElementById('uploadImageForm');
  const nameInput = document.getElementById('name');
  const suggestionsDiv = document.getElementById('suggestions');
  const imagesInput = document.getElementById('images');
  const previewDiv = document.getElementById('preview');
  const submitBtn = document.getElementById('submitBtn');
  const resultDiv = document.getElementById('result');

  // Preview selected images
  imagesInput.addEventListener('change', () => {
    previewDiv.innerHTML = '';
    if (imagesInput.files.length > 4) {
      alert('Maximum 4 images allowed');
      imagesInput.value = '';
      return;
    }
    [...imagesInput.files].forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.className = 'preview-img';
        previewDiv.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  // Autocomplete for name
  let timeout;
  nameInput.addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(async () => {
      const query = nameInput.value.trim();
      if (query.length < 3) {
        suggestionsDiv.style.display = 'none';
        return;
      }

      try {
        const ministry = document.getElementById('ministry').value;
        if (!ministry) return;

        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&ministry=${ministry}`);
        const people = await res.json();

        suggestionsDiv.innerHTML = '';
        if (people.length === 0) {
          suggestionsDiv.style.display = 'none';
          return;
        }

        people.forEach(person => {
          const item = document.createElement('div');
          item.className = 'suggestion-item';
          item.textContent = person.name;
          item.onclick = () => {
            nameInput.value = person.name;
            suggestionsDiv.style.display = 'none';
          };
          suggestionsDiv.appendChild(item);
        });

        suggestionsDiv.style.display = 'block';
      } catch (err) {
        suggestionsDiv.style.display = 'none';
      }
    }, 300);
  });

  // Hide suggestions when clicking outside
  document.addEventListener('click', e => {
    if (e.target !== nameInput) {
      suggestionsDiv.style.display = 'none';
    }
  });

  // Form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Uploading...';
    resultDiv.innerHTML = '';

    try {
      const res = await fetch('/api/upload-image', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();

      if (data.success) {
        resultDiv.innerHTML = `<div class="success">${data.message}</div>`;
        form.reset();
        previewDiv.innerHTML = '';
      } else {
        resultDiv.innerHTML = `<div class="error">Error: ${data.error || 'Upload failed'}</div>`;
      }
    } catch (err) {
      resultDiv.innerHTML = `<div class="error">Network error: ${err.message}</div>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Upload Photos';
    }
  });
</script>
</body>
</html>
