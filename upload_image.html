<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Photos - GPD Admin Portal</title>
  <link rel="stylesheet" href="/public/css_file/styles.css" />
  <style>
    body { background: linear-gradient(135deg, #003366, #0066cc); min-height: 100vh; }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }
    .back { display: inline-block; margin-bottom: 20px; color: #003366; text-decoration: none; font-weight: bold; }
    h1 { text-align: center; color: #003366; font-size: 2.2rem; margin-bottom: 20px; }
    select, input[type="text"] {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 1.1rem;
    }
    .upload-area {
      border: 4px dashed #003366;
      border-radius: 20px;
      padding: 60px;
      text-align: center;
      background: #f8fbff;
      cursor: pointer;
      margin: 20px 0;
    }
    .preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .preview img { width: 100%; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    button {
      display: block;
      width: 300px;
      margin: 30px auto;
      padding: 16px;
      background: linear-gradient(135deg, #003366, #0066cc);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
    }
    .result { margin-top: 30px; text-align: center; font-weight: bold; font-size: 1.2rem; }
    .success { color: green; }
    .error { color: red; }
    #name-suggestions {
      max-height: 200px;
      overflow-y: auto;
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      margin-top: -10px;
      margin-bottom: 20px;
      display: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .suggestion-item {
      padding: 15px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      transition: background 0.3s;
    }
    .suggestion-item:hover {
      background: #f0f0f0;
    }
    .suggestion-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="container">
  <a href="/admin" class="back">← Back to Dashboard</a>
  <h1>Upload Up to 4 Photos</h1>

  <form id="uploadForm" enctype="multipart/form-data">
    <select name="ministry" id="ministry-select" required>
      <option value="">-- Select Ministry --</option>
      <option value="campus">BLW Campus Ministry</option>
      <option value="church">Christ Embassy Church Ministry</option>
    </select>

    <input type="text" name="name" id="name-input" placeholder="Full Name (Exact Match Required)" required>
    <div id="name-suggestions"></div>

    <div class="upload-area">
      <h3>Drop up to 4 images here</h3>
      <p>or click to select • JPG, PNG, WebP</p>
      <input type="file" name="images" accept="image/*" multiple required>
    </div>

    <div id="preview" class="preview"></div>

    <button type="submit">Upload Photos</button>
  </form>

  <div id="result" class="result"></div>
</div>

<script>
  document.querySelector('input[type="file"]').onchange = function(e) {
    const preview = document.getElementById('preview');
    preview.innerHTML = '';
    Array.from(e.target.files).slice(0, 4).forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.createElement('img');
        img.src = ev.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  };

  document.getElementById('uploadForm').onsubmit = async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const res = await fetch('/api/upload-image', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    document.getElementById('result').innerHTML = data.success
      ? '<span class="success">' + data.message + '</span>'
      : '<span class="error">Error: ' + data.error + '</span>';
  };

  // Autocomplete for name input
  const nameInput = document.getElementById('name-input');
  const suggestionsDiv = document.getElementById('name-suggestions');
  const ministrySelect = document.getElementById('ministry-select');

  nameInput.addEventListener('input', async function() {
    const query = this.value.trim();
    const ministry = ministrySelect.value;

    if (query.length < 2 || !ministry) {
      suggestionsDiv.style.display = 'none';
      return;
    }

    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&ministry=${ministry}`);
      const data = await res.json();

      suggestionsDiv.innerHTML = '';
      if (data.length === 0) {
        suggestionsDiv.style.display = 'none';
        return;
      }

      data.forEach(person => {
        const item = document.createElement('div');
        item.classList.add('suggestion-item');
        item.textContent = person.name;
        item.onclick = () => {
          nameInput.value = person.name;
          suggestionsDiv.style.display = 'none';
        };
        suggestionsDiv.appendChild(item);
      });

      suggestionsDiv.style.display = 'block';
    } catch (err) {
      console.error(err);
      suggestionsDiv.style.display = 'none';
    }
  });

  // Hide suggestions on click outside
  document.addEventListener('click', e => {
    if (e.target !== nameInput) {
      suggestionsDiv.style.display = 'none';
    }
  });
</script>

</body>
</html>
