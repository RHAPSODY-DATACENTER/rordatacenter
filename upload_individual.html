<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Individual Record - GPD Admin Portal</title>
  <link rel="stylesheet" href="/public/css_file/styles.css" />
  <style>
    body { background: linear-gradient(135deg, #003366, #0066cc); min-height: 100vh; }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }
    .back { display: inline-block; margin-bottom: 20px; color: #003366; text-decoration: none; font-weight: bold; }
    h1 { text-align: center; color: #003366; font-size: 2.2rem; margin-bottom: 30px; }
    select { width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 2px solid #ddd; font-size: 1.1rem; }
    .form-section { display: none; }
    .form-section.active { display: block; }
    input[type="text"] {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 1rem;
    }
    button {
      display: block;
      width: 300px;
      margin: 30px auto;
      padding: 16px;
      background: linear-gradient(135deg, #003366, #0066cc);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
    }
    .result { margin-top: 30px; text-align: center; font-weight: bold; font-size: 1.2rem; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

<div class="container">
  <a href="/admin" class="back">← Back to Dashboard</a>
  <h1>Add Individual Record</h1>

  <select id="ministrySelect" onchange="showForm()" required>
    <option value="">-- Select Ministry --</option>
    <option value="campus">BLW Campus Ministry</option>
    <option value="church">Christ Embassy Church Ministry</option>
  </select>

  <!-- BLW Campus Form -->
  <div id="campus-form" class="form-section">
    <input type="text" placeholder="Region" id="campus-region">
    <input type="text" placeholder="Designation" id="campus-designation">
    <input type="text" placeholder="Name (Required)" id="campus-name" required>
    <input type="text" placeholder="KC ID" id="campus-kcid">
    <input type="text" placeholder="BLW Zone" id="campus-zone">
    <input type="text" placeholder="Group Name" id="campus-group">
    <input type="text" placeholder="Chapter" id="campus-chapter">
    <button onclick="addRecord('campus')">Add Campus Record</button>
  </div>

  <!-- Christ Embassy Church Form -->
  <div id="church-form" class="form-section">
    <input type="text" placeholder="Region" id="church-region">
    <input type="text" placeholder="DSP" id="church-dsp">
    <input type="text" placeholder="Zone" id="church-zone">
    <input type="text" placeholder="Virtual Zone" id="church-virtual">
    <input type="text" placeholder="Group" id="church-group">
    <input type="text" placeholder="Sub Group" id="church-subgroup">
    <input type="text" placeholder="Church/Zone" id="church-churchzone">
    <input type="text" placeholder="Reg Sub" id="church-regsub">
    <input type="text" placeholder="Designation" id="church-designation">
    <input type="text" placeholder="Name (Required)" id="church-name" required>
    <input type="text" placeholder="KC ID" id="church-kcid">
    <button onclick="addRecord('church')">Add Church Record</button>
  </div>

  <div id="result" class="result"></div>
</div>

<script>
  function showForm() {
    const ministry = document.getElementById('ministrySelect').value;
    document.getElementById('campus-form').classList.toggle('active', ministry === 'campus');
    document.getElementById('church-form').classList.toggle('active', ministry === 'church');
  }

  async function addRecord(ministry) {
    const prefix = ministry === 'campus' ? 'campus' : 'church';
    const name = document.getElementById(prefix + '-name').value.trim();
    if (!name) {
      document.getElementById('result').innerHTML = '<span class="error">Name is required</span>';
      return;
    }

    const data = {
      ministry: ministry,
      name: name,
      region: document.getElementById(prefix + '-region').value.trim(),
      designation: document.getElementById(prefix + '-designation').value.trim(),
      kc_id: document.getElementById(prefix + '-kcid').value.trim()
    };

    if (ministry === 'campus') {
      data.blw_zone = document.getElementById('campus-zone').value.trim();
      data.group_name = document.getElementById('campus-group').value.trim();
      data.chapter = document.getElementById('campus-chapter').value.trim();
    } else {
      data.dsp = document.getElementById('church-dsp').value.trim();
      data.zone = document.getElementById('church-zone').value.trim();
      data.virtual_zone = document.getElementById('church-virtual').value.trim();
      data.group_name = document.getElementById('church-group').value.trim();
      data.sub_group = document.getElementById('church-subgroup').value.trim();
      data.church = document.getElementById('church-churchzone').value.trim();
      data.reg_sub = document.getElementById('church-regsub').value.trim();
    }

    const res = await fetch('/api/add-record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();

    document.getElementById('result').innerHTML = result.success
      ? '<span class="success">Record added successfully!</span>'
      : '<span class="error">Error: ' + result.error + '</span>';
  }
</script>

</body>
</html>
